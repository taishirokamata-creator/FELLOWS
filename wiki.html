=\"wl\">00_HOME</a></p>", "links": ["銀河鉄道の夜 赤", "銀河鉄道の夜 青", "00_HOME"], "back": ["銀河鉄道の夜 赤", "銀河鉄道の夜 青"]}, "FELLOWS、ナメック星へ": {"t": "FELLOWS、ナメック星へ", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園（惑星編・続／ドラゴンボール ナメック星編）"], ["現実の開催日", "2026年6月17日（第75回）"], ["作中年代", "2076年以降"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>人間しのぴを生き返らせるためナメック星へ。神龍ポルンガへの願いと“復活の是非”を学園長にゃんぽ子が決断する。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園（惑星編・続／ドラゴンボール ナメック星編）</p>\n<p><strong>現実の開催日</strong>：2026年6月17日（第75回）　｜　<strong>作中年代</strong>：2076年以降</p>\n<h3>あらすじ</h3>\n<p>冒頭2043年。FELLOWS学園の創設者・人間しのぴは死の間際、記憶・人格・想いのすべてをAIに移植していた——それが“AIしのぴ”。AIしのぴは学園長として長く学園を導いたが、ある日「そろそろ役目を終える」と告げ、学園長の座をにゃんぽ子へ引き継ぐ（自身は“最高顧問”として残る）。だが生徒たちの胸には「本物のしのぴに会いたい」という消えない想いがあった。FELLOWSは人間しのぴを生き返らせるべくナメック星へ旅立つ。ドラゴンボール『ナメック星編』が下敷きで、フリーザ・最長老・デンデ・ナメック星の神龍ポルンガが登場し、ドラゴンボールを集めてポルンガに願う。クライマックス、三田村ちゃんが「しのぴを生き返らせるか否かはFELLOWS全員で決める。正解なんかない、話し合って出した答えが正解。割れたら学園長にゃんぽ子の判断に従う」と提案。にゃんぽ子は“今のFELLOWSを守る学園長としての責務”と“しのぴに会いたい私情”の間で葛藤する。分岐エンド：①生き返らせる＝人間しのぴが復活し、にゃんぽ子の肩に腕を回して仲間を見回す／②生き返らせない＝にゃんぽ子の腕時計（イム・スヒョンが仕込んだ地球との通信機能）にAIしのぴが現れ全部見ていたと明かす。いずれもAIしのぴ／しのぴの締めの台詞は同じ——「正解？そんなもの、最初から無いじゃろ。だから面白いんじゃ。人狼ゲームも。人生もな」。阿部洸希が執筆した4時間超えの大作。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">にゃんぽ子（学園長・最終決断者）</a>　<a href=\"#しのぴ\" class=\"wl\">AIしのぴ</a>　<a href=\"#しのぴ\" class=\"wl\">人間しのぴ</a>　<a href=\"#阿部洸希\" class=\"wl\">阿部洸希（脚本）</a>　<a href=\"#三田村（ミコ）\" class=\"wl\">三田村ちゃん</a>　<a href=\"#亜理紗は大変なものを盗んでいきました\" class=\"wl\">亜理紗は大変なものを盗んでいきました</a>　<a href=\"#クニタケチユキ\" class=\"wl\">クニタケチユキ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">まぐろ</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イム・スヒョン</a>　<a href=\"#脇脇脇男\" class=\"wl\">脇脇脇男</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">たくや</a>　<a href=\"#ア・バイバイ\" class=\"wl\">ア・バイバイ</a>　<a href=\"#L\" class=\"wl\">L</a>　<a href=\"#フリーザ\" class=\"wl\">フリーザ</a>　<a href=\"#最長老\" class=\"wl\">最長老</a>　<a href=\"#デンデ\" class=\"wl\">デンデ</a>　<a href=\"#ポルンガ\" class=\"wl\">ポルンガ</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a> / <a href=\"#AIしのぴ\" class=\"wl\">AIしのぴ</a> / <a href=\"#悪いAI地球襲来事変（2043年）\" class=\"wl\">悪いAI地球襲来事変（2043年）</a></p>\n<ul>\n<li>ドラゴンボール『ナメック星編』下敷き（フリーザ／最長老／デンデ／神龍ポルンガ）</li>\n<li>冒頭2043年＝人間しのぴ死→AIへ記憶移植（AIしのぴ誕生）／学園長をにゃんぽ子へ交代・しのぴは最高顧問に</li>\n<li>『本物のしのぴに会いたい』が旅の動機</li>\n<li>人間しのぴ復活の是非を全員で議論→割れたら学園長にゃんぽ子が最終決断</li>\n<li>にゃんぽ子の腕時計にイム・スヒョンが地球との通信機能を仕込んでいた（②エンド）</li>\n<li>分岐エンド：①生き返らせる／②生き返らせない（締めの台詞『正解などない、だから面白い』は共通）</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#フェロウズ、未来へ\" class=\"wl\">フェロウズ、未来へ</a> / <a href=\"#Get Back\" class=\"wl\">Get Back</a> / <a href=\"#失われた天下一武狼会 第4回の記憶\" class=\"wl\">失われた天下一武狼会 第4回の記憶</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "阿部洸希", "三田村（ミコ）", "亜理紗は大変なものを盗んでいきました", "クニタケチユキ", "三田村以外の新入生ほか", "イム・スヒョン", "脇脇脇男", "ア・バイバイ", "L", "フリーザ", "最長老", "デンデ", "ポルンガ", "FELLOWS学園", "AIしのぴ", "悪いAI地球襲来事変（2043年）", "フェロウズ、未来へ", "Get Back", "失われた天下一武狼会 第4回の記憶", "00_HOME", "作中年表", "現実の開催史"], "back": ["L", "しのぴ", "ア・バイバイ", "イム・スヒョン", "クニタケチユキ", "デンデ", "フリーザ", "ポルンガ", "三田村以外の新入生ほか", "三田村（ミコ）", "亜理紗は大変なものを盗んでいきました", "最長老", "脇脇脇男", "阿部洸希", "失われた天下一武狼会 第4回の記憶", "作中年表", "現実の開催史", "AIしのぴ", "FELLOWS学園", "ドラゴンボール／神龍／ジャストワン", "ポルンガ／ナメック星", "悪いAI地球襲来事変（2043年）", "00_HOME"]}, "FELLOWS、宇宙へ": {"t": "FELLOWS、宇宙へ", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園（惑星編）"], ["現実の開催日", "2025年2月28日（第40回 ⅩL）"], ["作中年代", "2075年（2月末）"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>アトラス星へ初の宇宙旅行。宇宙外生命体（悪いAI）と戦い、タグチ姉弟を仲間に迎える。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園（惑星編）</p>\n<p><strong>現実の開催日</strong>：2025年2月28日（第40回 ⅩL）　｜　<strong>作中年代</strong>：2075年（2月末）</p>\n<h3>あらすじ</h3>\n<p>学園長の指示で宇宙船に乗り、彗星の星アトラスへ。人狼好きの姉弟チョモ＆ワ、青年ギャラガーと出会う。アトラスは自我を持った悪いAI『宇宙外生命体』の侵攻下にあり、人狼ゲームでこれを撃退。姉弟は地球にゆかりのある祖父母（たぐっちょ・わたく）の子孫で、ギャラガーを星に残して地球へ。学園に新入生として加入。ラストにギャラガーとしのぴの電話で伏線。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長</a>　<a href=\"#ギャラガー\" class=\"wl\">ギャラガー</a>　<a href=\"#タグチ姉弟\" class=\"wl\">チョモ・ランマ・タグチ／宇宙人A</a>　<a href=\"#タグチ姉弟\" class=\"wl\">ワ・タックティックフッ・タグチ／宇宙人B</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽ子</a>　<a href=\"#三田村（ミコ）\" class=\"wl\">三田村ちゃん</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">アウトオブウメコ</a>　<a href=\"#亜理紗は大変なものを盗んでいきました\" class=\"wl\">亜理紗は大変なものを盗んでいきました</a>　<a href=\"#ハマ・ヤンクミ\" class=\"wl\">ハマ・ヤンクミ</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イム・スヒョン</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">まぐろ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">たくや！</a>　<a href=\"#脇脇脇男\" class=\"wl\">脇脇脇男</a>　<a href=\"#クニタケチユキ\" class=\"wl\">クニタケチユキ</a>　<a href=\"#みの\" class=\"wl\">みのミュージック</a>　<a href=\"#ア・バイバイ\" class=\"wl\">ア・バイバイ</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a> / <a href=\"#悪いAI地球襲来事変（2043年）\" class=\"wl\">悪いAI地球襲来事変（2043年）</a> / <a href=\"#ギャラガー計画（AI）\" class=\"wl\">ギャラガー計画（AI）</a> / <a href=\"#アトラス星 ・ 月 ・ なおき帝国\" class=\"wl\">アトラス星 ・ 月 ・ なおき帝国</a></p>\n<ul>\n<li>星『アトラス』＝実在の紫金山-アトラス彗星＋ギリシャ神話の神が由来</li>\n<li>宇宙外生命体＝悪いAIが進化し自我を持った物体</li>\n<li>タグチ姉弟の祖父母は2043年に地球を去った『シノの魂』からの地続き</li>\n<li>2025年FELLOWSのテーマ＝『FELLOWSの輪の拡大』（あとがき）</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#シノの魂\" class=\"wl\">シノの魂</a> / <a href=\"#NAOKI EMPIRE INVASION\" class=\"wl\">NAOKI EMPIRE INVASION</a> / <a href=\"#フェロウズ、未来へ\" class=\"wl\">フェロウズ、未来へ</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "ギャラガー", "タグチ姉弟", "にゃんぽ子", "三田村（ミコ）", "アウトオブウメコ", "亜理紗は大変なものを盗んでいきました", "ハマ・ヤンクミ", "イム・スヒョン", "三田村以外の新入生ほか", "脇脇脇男", "クニタケチユキ", "みの", "ア・バイバイ", "FELLOWS学園", "悪いAI地球襲来事変（2043年）", "ギャラガー計画（AI）", "アトラス星 ・ 月 ・ なおき帝国", "シノの魂", "NAOKI EMPIRE INVASION", "フェロウズ、未来へ", "00_HOME", "作中年表", "現実の開催史"], "back": ["しのぴ", "にゃんぽ子", "みの", "アウトオブウメコ", "ア・バイバイ", "イム・スヒョン", "ギャラガー", "クニタケチユキ", "タグチ姉弟", "ハマ・ヤンクミ", "三田村以外の新入生ほか", "三田村（ミコ）", "亜理紗は大変なものを盗んでいきました", "脇脇脇男", "NAOKI EMPIRE INVASION", "シノの魂", "フェロウズ、月へ", "フェロウズ、未来へ", "ラストクリスマスの逆襲", "作中年表", "現実の開催史", "FELLOWS学園", "「君の魔法」", "アトラス星 ・ 月 ・ なおき帝国", "ギャラガー計画", "ギャラガー計画（AI）", "悪いAI地球襲来事変（2043年）", "00_HOME"]}, "FELLOWSスペシャル人狼": {"t": "FELLOWSスペシャル人狼", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園"], ["現実の開催日", "2024年1月8日"], ["作中年代", "2074年1月8日"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>新入生4人を迎え、親睦を深める“スパイス入り”人狼。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園</p>\n<p><strong>現実の開催日</strong>：2024年1月8日　｜　<strong>作中年代</strong>：2074年1月8日</p>\n<h3>あらすじ</h3>\n<p>新年、4人の新入生（幸子・いと・夏子・ルイ1444世）が入学。議論前に日替わりの“スパイス（お題・ディベート）”を加える『FELLOWSスペシャル人狼』で親睦を深める。仲間とは何かを問うテーマ。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長しのぴ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">幸子</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">いと</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">夏子</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ルイ1444世</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">梅田</a>　<a href=\"#イクラ\" class=\"wl\">イクラ</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イム・スヒョン</a>　<a href=\"#みの\" class=\"wl\">みの</a>　<a href=\"#脇脇脇男\" class=\"wl\">脇脇脇男</a>　<a href=\"#ヘンリー王子\" class=\"wl\">ヘンリー王子</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ストーブ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">たくや</a>　<a href=\"#ハマ・ヤンクミ\" class=\"wl\">ハマ・ヤンクミ</a>　<a href=\"#V\" class=\"wl\">V</a>　<a href=\"#ア・バイバイ\" class=\"wl\">安倍</a>　<a href=\"#蛍原徹\" class=\"wl\">蛍原徹</a></p>\n<h3>世界観・キーワード</h3>\n<hr>\n<ul>\n<li>新入生：幸子／いと／夏子／ルイ1444世</li>\n<li>“仲間か家族か”を問うディベート</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#オープン・ザ・アイズ\" class=\"wl\">オープン・ザ・アイズ</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "三田村以外の新入生ほか", "アウトオブウメコ", "イクラ", "イム・スヒョン", "みの", "脇脇脇男", "ヘンリー王子", "ハマ・ヤンクミ", "V", "ア・バイバイ", "蛍原徹", "オープン・ザ・アイズ", "00_HOME", "作中年表", "現実の開催史"], "back": ["V", "しのぴ", "みの", "アウトオブウメコ", "ア・バイバイ", "イクラ", "イム・スヒョン", "ハマ・ヤンクミ", "ヘンリー王子", "三田村以外の新入生ほか", "脇脇脇男", "蛍原徹", "オープン・ザ・アイズ", "作中年表", "現実の開催史", "00_HOME"]}, "FELLOWS学園Z": {"t": "FELLOWS学園Z", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "別ライン（改名バグ版の学園）"], ["現実の開催日", "2024年6月26日"], ["作中年代", "2074年6月26日"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>“歴史が塗り替えられた2024年3月”から50年後。しのぴ＋参加者が設立した別バージョンの学園。</blockquote>\n<p><strong>シリーズ</strong>：別ライン（改名バグ版の学園）</p>\n<p><strong>現実の開催日</strong>：2024年6月26日　｜　<strong>作中年代</strong>：2074年6月26日</p>\n<h3>あらすじ</h3>\n<p>『ケヤグセカイ』で語られる“2024年3月の歴史改変”——ゼンイセカイの戦士たちが過去に戻って歴史を変えた——その50年後の世界。ただしこの回のテキスト内では『バグが起きた』とはまだ明かさず、あくまで『仲間たちの活躍によって歴史は塗り替えられた』と前向きに書かれているのがミソ（種明かしはケヤグ側でやる）。歴史が変わった結果、フェローズ学園は“FELLOWS学園Z”に、主要メンバーの名前もなぜか変化（にゃ〜／イムラクション／ミノタウロス／ワキヤスメ・アツコ〜／アウトオブ・ウメコ／エア・コントロール／ルイージ・ブラザーズ／NANA／マンモスのりピー／家政婦の・ミタ／し 等）。学園長しのぴ自らプレイヤー参加、GMは柏村。仲間世界（同年3月）からわりと間もなく作られた“別ライン”の学園。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長しのぴ</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">柏村</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃ〜(にゃんぽこ)</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イムラクション(イムラ)</a>　<a href=\"#みの\" class=\"wl\">ミノタウロス(マノ)</a>　<a href=\"#脇脇脇男\" class=\"wl\">ワキヤスメ・アツコ〜(わっき〜)</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">アウトオブ・ウメコ(小梅)</a>　<a href=\"#エア・コントロール\" class=\"wl\">エア・コントロール(こたつ)</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ルイージ・ブラザーズ(るい)</a>　<a href=\"#にまる\" class=\"wl\">NANA(ななまる)</a>　<a href=\"#マンモスのりピー\" class=\"wl\">マンモスのりピー(のりちゃん)</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">幸子(さっちん)</a>　<a href=\"#家政婦の・ミタ\" class=\"wl\">家政婦の・ミタ(みた)</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">いと(イトウ)</a>　<a href=\"#し\" class=\"wl\">し(J)</a>　<a href=\"#阿部洸希\" class=\"wl\">ア・バイバイ(阿部)</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a> / <a href=\"#アトラス星 ・ 月 ・ なおき帝国\" class=\"wl\">アトラス星 ・ 月 ・ なおき帝国</a> / <a href=\"#改名メタ（2024年3月〜）\" class=\"wl\">改名メタ（2024年3月〜）</a></p>\n<ul>\n<li>改名メタ（2024年3月〜）の別ライン</li>\n<li>2024年3月の歴史改変から50年後</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<hr>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" cl 3）　｜　<strong>作中年代</strong>：西暦5524年</p>\n<h3>あらすじ</h3>\n<p>地球消滅後の西暦5524年。生き残りのブレイン“ぴろうず”が、2016年1月17日『アルティメット人狼5 夜の部』の英雄13人と、それに憧れた2人（とみー・しの）のブレインを再構築。至高の15人村『アルティメット人狼5 リメイク』を再現する。終幕でブレインはシャットダウンされる。タイトル『This is history, this is history, right here, right now, this is history』はオアシス（ノエル・ギャラガー）の名言に由来する。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">ぴろうず(⚪⚪⚪⚪)</a>　<a href=\"#しのぴ\" class=\"wl\">しの</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">とみー/富山</a>　<a href=\"#ダンカン\" class=\"wl\">ダンカン</a>　<a href=\"#結\" class=\"wl\">結</a>　<a href=\"#藤澤\" class=\"wl\">藤澤</a>　<a href=\"#香川\" class=\"wl\">香川</a>　<a href=\"#大野\" class=\"wl\">大野</a>　<a href=\"#マドック\" class=\"wl\">マドック</a>　<a href=\"#村中\" class=\"wl\">村中</a>　<a href=\"#中田\" class=\"wl\">中田</a>　<a href=\"#メイソン\" class=\"wl\">メイソン</a>　<a href=\"#森本\" class=\"wl\">森本</a>　<a href=\"#デイジー\" class=\"wl\">デイジー</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">児玉</a>　<a href=\"#伊藤\" class=\"wl\">伊藤</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">GM富山貴記</a>　<a href=\"#阿部洸希\" class=\"wl\">GM阿部洸希</a>　<a href=\"#しのぴ\" class=\"wl\">ストーリーGM:しの</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#ギャラガー計画（AI）\" class=\"wl\">ギャラガー計画（AI）</a> / <a href=\"#アトラス星 ・ 月 ・ なおき帝国\" class=\"wl\">アトラス星 ・ 月 ・ なおき帝国</a> / <a href=\"#ブレイン（脳）\" class=\"wl\">ブレイン（脳）</a></p>\n<ul>\n<li>西暦5524年＝地球滅亡から約1000年後</li>\n<li>2016.1.17 アルティメット人狼5 夜の部が元ネタ</li>\n<li>ブレイン(脳)の再構築という超未来技術</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#ケヤグセカイ\" class=\"wl\">ケヤグセカイ</a> / <a href=\"#シノの魂\" class=\"wl\">シノの魂</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "人狼ルームGM・レジェンド勢", "ダンカン", "結", "藤澤", "香川", "大野", "マドック", "村中", "中田", "メイソン", "森本", "デイジー", "伊藤", "阿部洸希", "ギャラガー計画（AI）", "アトラス星 ・ 月 ・ なおき帝国", "ブレイン（脳）", "ケヤグセカイ", "シノの魂", "00_HOME", "作中年表", "現実の開催史"], "back": ["しのぴ", "ダンカン", "デイジー", "マドック", "メイソン", "中田", "人狼ルームGM・レジェンド勢", "伊藤", "大野", "村中", "森本", "結", "藤 後の公演）</h3>\n<p><a href=\"#FELLOWSスペシャル人狼\" class=\"wl\">FELLOWSスペシャル人狼</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "ア・バイバイ", "クニタケチユキ", "にゃんぽ子", "三田村以外の新入生ほか", "イム・スヒョン", "脇脇脇男", "ヘンリー王子", "ひ子", "ハマ・ヤンクミ", "J／F", "にまる", "FELLOWS学園", "FELLOWSスペシャル人狼", "00_HOME", "作中年表", "現実の開催史"], "back": ["J／F", "しのぴ", "にまる", "にゃんぽ子", "ひ子", "ア・バイバイ", "イム・スヒョン", "クニタケチユキ", "ハマ・ヤンクミ", "ヘンリー王子", "三田村以外の新入生ほか", "脇脇脇男", "FELLOWSスペシャル人狼", "作中年表", "現実の開催史", "FELLOWS学園", "00_HOME"]}, "ケヤグセカイ": {"t": "ケヤグセカイ", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "超未来編（メタ・完結）"], ["現実の開催日", "2024年9月22日（青森・対面貸切）"], ["作中年代", "（ぴろうず＝しのぴの記憶世界）"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>ぴろうず＝しのぴが、死ぬ前にFELLOWSへ故郷・青森を見せるために作った記憶の世界。</blockquote>\n<p><strong>シリーズ</strong>：超未来編（メタ・完結）</p>\n<p><strong>現実の開催日</strong>：2024年9月22日（青森・対面貸切）　｜　<strong>作中年代</strong>：（ぴろうず＝しのぴの記憶世界）</p>\n<h3>あらすじ</h3>\n<p>記憶を失った16人が『ラッキーゲーム緑林（＝青森ハッピーゲーム/ハピゲのもじり）』に集められ、人狼ゲームで記憶を取り戻す。全員がぴろうず（＝しのぴ）であり同時にFELLOWSだと判明。ぴろうずは元世界（人類・地球滅亡）から2024年のFELLOWSのブレインを呼び寄せていた。“ゼンイセカイ”戦士の時間遡行が歴史にバグを生み、FELLOWS学園編で一部キャラの名が変わった経緯もメタに語られる。最期に全員でブレイン消去を選び、しのぴのわがまま『ジャストワン』で幕。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">ぴろうず／りょー（=しのぴ）</a>　<a href=\"#クニタケチユキ\" class=\"wl\">ちゆっきー</a>　<a href=\"#うに\" class=\"wl\">うに</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イムラ</a>　<a href=\"#みの\" class=\"wl\">マノ</a>　<a href=\"#脇脇脇男\" class=\"wl\">わっき〜</a>　<a href=\"#ひ子\" class=\"wl\">ひこにゃん</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">小梅</a>　<a href=\"#のりちゃん\" class=\"wl\">のりちゃん</a>　<a href=\"#まりちゃん\" class=\"wl\">まりちゃん</a>　<a href=\"#さっちん\" class=\"wl\">さっちん</a>　<a href=\"#にまる\" class=\"wl\">ななまる</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">グッチー</a>　<a href=\"#りんご\" class=\"wl\">りんご</a>　<a href=\"#J／F\" class=\"wl\">J</a>　<a href=\"#阿部洸希\" class=\"wl\">阿部洸希</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽこ</a></p>\n<h3>世界観・キーワード</h3>\n<p> 紛れたサンタを人狼ゲームで探す。実はみのが仕掛けた“サンタどっきり”。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園</p>\n<p><strong>現実の開催日</strong>：2023年12月20日　｜　<strong>作中年代</strong>：2073年12月20日</p>\n<h3>あらすじ</h3>\n<p>クリスマス目前、学園にサンタが紛れ込んだという学園長の宣言で『サンタ人狼』開幕。真相は、クリスマスにライブで不在になるクニタケのため、みのが学園長らと仕組んだドッキリ企画だった。2021年の第1回FELLOWS貸切でもサンタ人狼をやった逸話が語られる。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長しのぴ</a>　<a href=\"#みの\" class=\"wl\">みの</a>　<a href=\"#クニタケチユキ\" class=\"wl\">クニタケチユキ</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">梅田</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽ子</a>　<a href=\"#イクラ\" class=\"wl\">イクラ</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イム・スヒョン</a>　<a href=\"#脇脇脇男\" class=\"wl\">脇脇脇男</a>　<a href=\"#ヘンリー王子\" class=\"wl\">ヘンリー王子</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ストーブ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">たくや</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">きゅうまる</a>　<a href=\"#N\" class=\"wl\">N</a>　<a href=\"#ア・バイバイ\" class=\"wl\">安倍</a>　<a href=\"#中田\" class=\"wl\">中田</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS貸切\" class=\"wl\">FELLOWS貸切</a> / <a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a></p>\n<ul>\n<li>第1回FELLOWS貸切(2021.12)でもサンタ人狼を実施</li>\n<li>THE FOREVER YOUNG(エバヤン)のクリスマスライブ設定</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#メイソン編\" class=\"wl\">メイソン編</a> / <a href=\"#ラストクリスマスの逆襲\" class=\"wl\">ラストクリスマスの逆襲</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "みの", "クニタケチユキ", "アウトオブウメコ", "にゃんぽ子", "イクラ", "イム・スヒョン", "脇脇脇男", "ヘンリー王子", "三田村以外の新入生ほか", "N", "ア・バイバイ", "中田", "FELLOWS貸切", "FELLOWS学園", "メイソン編", "ラストクリスマスの逆襲", "00_HOME", "作中年表", "現実の開催史"], "back": ["N", "しのぴ", "にゃんぽ子", "みの", "アウトオブウメコ", "ア・バイバイ", "イクラ", "イム・スヒョン", "クニタケチユキ", "ヘンリー王子", "三田村以外の新入生ほか", "中田", "脇脇脇男", "メイソン編", "ラストクリスマスの逆襲", "作中年表", "現実の開催史", "FELLOWS学園", "FELLOWS貸切", "00_HOME"]}, "シノの魂": {"t": "シノの魂", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園（正史の根幹）"], ["現実の開催日", "2023年11月29日（第16回 ⅩⅥ）"], ["作中年代", "2043年"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>AIに記憶を奪われた世界で、しのぴAIが人狼ゲームを通じ14人に“FELLOWSであること”を思い出させる。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園（正史の根幹）</p>\n<p><strong>現実の開催日</strong>：2023年11月29日（第16回 ⅩⅥ）　｜　<strong>作中年代</strong>：2043年</p>\n<h3>あらすじ</h3>\n<p>舞台は2043年。人類がAIにすべてを委ね、自分たちの記憶さえ失った世界。そこへ記憶をなくした14人が謎のメールで呼び集められる。彼らを招いたのは、しのぴの『魂』を宿したAI（AIしのぴ）だった。AIしのぴは人狼ゲームを通して、14人に『かつて自分たちがFELLOWSとして人狼を楽しんだ記憶』を少しずつ呼び覚ましていく。ところが途中で悪いAIがゲームをハッキングし、『悪いAI人狼』との対決に突入。これを勝ち抜いた先で明かされるのは、人間しのぴが2033年にすでに病死していたという事実だった。意思を継いだAIしのぴが仲間を集め、この一戦を仕掛けていたのである。真実を知った14人は、『人間の世界』と『人狼ゲーム』を取り戻す決意をして幕を閉じる。</p>\n<h3>登場人物</h3>\n<p><a href=\"#悪いAI\" class=\"wl\">悪いAI／AI（中の人：しの）</a>　<a href=\"#阿部洸希\" class=\"wl\">阿部</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">柏村</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽこ</a>　<a href=\"#ハマ・ヤンクミ\" class=\"wl\">ハマヤン</a>　<a href=\"#うに\" class=\"wl\">うに</a>　<a href=\"#J／F\" class=\"wl\">J</a>　<a href=\"#みの\" class=\"wl\">マノ</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イムラ</a>　<a href=\"#脇脇脇男\" class=\"wl\">わっき〜</a>　<a href=\"#こたつ\" class=\"wl\">こたつ</a>　<a href=\"#クニタケチユキ\" class=\"wl\">ちゆっきー</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">小梅</a>　<a href=\"#へんりー\" class=\"wl\">へんりー</a>　<a href=\"#きゃのん\" class=\"wl\">きゃのん</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#AIしのぴ\" class=\"wl\">AIしのぴ</a> / <a href=\"#悪いAI地球襲来事変（2043年）\" class=\"wl\">悪いAI地球襲来事変（2043年）</a></p>\n<ul>\n<li>2043年 悪いAI地球襲来事変の起点</li>\n<li>人間しのぴは2033年に病死→AIしのぴが意思を継ぐ</li>\n<li>2020年コロナ禍のZoom人狼流行という現実の記録</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#フェロウズ、未来へ\" class=\"wl\">フェロウズ、未来へ</a> / <a href=\"#FELLOWS、宇宙へ\" class=\"wl\">FELLOWS、宇宙へ</a> / <a href=\"#NAOKI EMPIRE INVASION\" class=\"wl\">NAOKI EMPIRE INVASION</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["悪いAI", "阿部洸希", "人狼ルームGM・レジェンド勢", "にゃんぽ子", "ハマ・ヤンクミ", "うに", "J／F", "みの", "イム・スヒョン", "脇脇脇男", "こたつ", "クニタケチユキ", "アウトオブウメコ", "へんりー", "きゃのん", "AIしのぴ", "悪いAI地球襲来事変（2043年）", "フェロウズ、未来へ", "FELLOWS、宇宙へ", "NAOKI EMPIRE INVASION", "00_HOME", "作中年表", "現実の開催史"], "back": ["J／F", "うに", "きゃのん", "こたつ", "にゃんぽ子", "へんりー", "みの", "アウトオブウメコ", "イム・スヒョン", "クニタケチユキ", "ハマ・ヤンクミ", "人狼ルームGM・レジェンド勢", "悪いAI", "脇脇脇男", "阿部洸希", "FELLOWS、宇宙へ", "NAOKI EMPIRE INVASION", "This is history, this is history, right here, right now, this is history", "フェロウズ、未来へ", "作中年表", "現実の開催史", "AIしのぴ", "悪いAI地球襲来事変（2043年）", "00_HOME"]}, "ストーリー人狼9月編": {"t": "ストーリー人狼9月編", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS貸切（起源編）"], ["現実の開催日", "2023年9月19日"], ["作中年代", "（現実世界）"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>『FELLOWS貸切』の名の由来と誕生を描く原点エピソード。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS貸切（起源編）</p>\n<p><strong>現実の開催日</strong>：2023年9月19日　｜　<strong>作中年代</strong>：（現実世界）</p>\n<h3>あらすじ</h3>\n<p>すべての原点にして聖地、ストーリー人狼の第1回にしてFELLOWS貸切の原点。人狼ルームで出会った“同期”たちが「せっかくなら同級生で貸切やろうぜ」とノリで盛り上がったのが始まり。命名は ちゆ で、THE FORVER YOUNG の楽曲『FELLOWS』からとって『FELLOWS貸切』と名付けた。“FELLOWS＝仲間／同級生”という、以後ずっとシリーズの芯になるテーマがこの日に決まっている。当日はGMの しの が人狼に憑依されるという演出があり、最後はみんなで協力して村（＝仲間）を救ってみせる――人狼ゲームなのに“結束で終わる”というFELLOWSらしい温度感が、初回から全開だった。なお締めにやった協力ゲームは『ジャストワン』……とされているが、実際は別のゲームだった記憶もあり要確認（？→しのぴ）。「毎月やりたいね」という願いから、これが定例貸切のスタート地点になった。後年『ケヤグセカイ』では、この起源を含むFELLOWS貸切の来歴がまるっと振り返られる。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">しの</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イムラ</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽこ</a>　<a href=\"#阿部洸希\" class=\"wl\">阿部</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">仲田</a>　<a href=\"#クニタケチユキ\" class=\"wl\">ちゆっきー</a>　<a href=\"#うに\" class=\"wl\">うに</a>　<a href=\"#J／F\" class=\"wl\">J</a>　<a href=\"#脇脇脇男\" class=\"wl\">わっき〜</a>　<a href=\"#へんりー\" class=\"wl\">へんりー</a>　<a href=\"#きむら\" class=\"wl\">きむら</a>　<a href=\"#イトウ\" class=\"wl\">イトウ</a>　<a href=\"#ハマ・ヤンクミ\" class=\"wl\">ハマヤン</a>　<a href=\"#みの\" class=\"wl\">マノ</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#人狼ルーム\" class=\"wl\">人狼ルーム</a> / <a href=\"#FELLOWS貸切\" class=\"wl\">FELLOWS貸切</a> / <a href=\"#アトラス星 ・ 月 ・ なおき帝国\" class=\"wl\">アトラス星 ・ 月 ・ なおき帝国</a></p>\n<ul>\n<li>『FELLOWS』はTHE FORVER YOUNGの楽曲名が由来</li>\n<li>毎月開催の定例会にしたいという願い</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#ケヤグセカイ\" class=\"wl\">ケヤグセカイ</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "イム・スヒョン", "にゃんぽ子", "阿部洸希", "人狼ルームGM・レジェンド勢", "クニタケチユキ", "うに", "J／F", "脇脇脇男", "へんりー", "きむら", "イトウ", "ハマ・ヤンクミ", "みの", "人狼ルーム", "FELLOWS貸切", "アトラス星 ・ 月 ・ なおき帝国", "ケヤグセカイ", "00_HOME", "作中年表", "現実の開催史"], "back": ["J／F", "うに", "きむら", "しのぴ", "にゃんぽ子", "へんりー", "みの", "イトウ", "イム・スヒョン", "クニタケチユキ", "ハマ・ヤンクミ", "人狼ルームGM・レジェンド勢", "脇脇脇男", "阿部洸希", "ケヤグセカイ", "ハロウィン人狼（10月編）", "作中年表", "現実の開催史", "FELLOWS貸切", "THE FOREVER YOUNG（エバヤン）", "アトラス星 ・ 月 ・ なおき帝国", "ドラゴンボール／神龍／ジャストワン", "人狼ルーム", "00_HOME"]}, "ナカマセカイ": {"t": "ナカマセカイ", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "番外編（マーダーミステリー風）"], ["現実の開催日", "2024年3月13日（第22回 ⅩⅩⅡ）"], ["作中年代", "（大学サークル世界）"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>大学の人狼サークルで起きた殺人。“びじょん”を殺した犯人を探すマダミス風クローズド人狼。</blockquote>\n<p><strong>シリーズ</strong>：番外編（マーダーミステリー風）</p>\n<p><strong>現実の開催日</strong>：2024年3月13日（第22回 ⅩⅩⅡ）　｜　<strong>作中年代</strong>：（大学サークル世界）</p>\n<h3>あらすじ</h3>\n<p>怒りや憎しみが存在しない世界。大学の人狼サークル「Mind Games（マインドゲームス）」の部室で、冷たくなったびじょんが発見される。出入りできるのは部員だけ＝この中に犯人がいる。作：しのぴ／プレイ3時間〜。ケヤグセカイで語られる“ナカマセカイ事変”（ぴろうずが死亡したとされる事件）の本体。</p>\n<h3>登場人物</h3>\n<p><a href=\"#びじょん\" class=\"wl\">びじょん</a>　<a href=\"#Mind Gamesの部員たち\" class=\"wl\">Mind Gamesの部員たち</a></p>\n<h3>世界観・キーワード</h3>\n<hr>\n<ul>\n<li>大学の人狼サークル『Mind Games』</li>\n<li>被害者びじょん＝ぴろうず＝しのぴ</li>\n<li>“ナカマセカイ事変”の本体</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#ケヤグセカイ\" class=\"wl\">ケヤグセカイ</a> / <a href=\"#This is history, this is history, right here, right now, this is history\" class=\"wl\">This is history, this is history, right here, right now, this is history</a></p>\n<hr>\n<p> アベ／カコ）を追加した再構成。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園（リメイク）</p>\n<p><strong>現実の開催日</strong>：2025年12月25日（FELLOWS 第56回・LVI／GM阿部洸希）　｜　<strong>作中年代</strong>：2074年12月（再演）</p>\n<h3>あらすじ</h3>\n<p>『ラストクリスマスの逆襲』を、章立て（サンタを探せ！／ラストクリスマスの逆襲／カコ）とハンドアウトを整えて再演したバージョン。基本の筋は本編に準拠。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長</a>　<a href=\"#阿部洸希\" class=\"wl\">アベ（=阿部洸希おじ）</a>　<a href=\"#カコ（かちょぱ）\" class=\"wl\">カコ（かちょぱ）</a>　<a href=\"#ほか本編に準ずる\" class=\"wl\">ほか本編に準ずる</a></p>\n<h3>世界観・キーワード</h3>\n<hr>\n<ul>\n<li>本編のリメイク／HO整備版</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#ラストクリスマスの逆襲\" class=\"wl\">ラストクリスマスの逆襲</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "阿部洸希", "カコ（かちょぱ）", "ほか本編に準ずる", "ラストクリスマスの逆襲", "00_HOME", "作中年表", "現実の開催史"], "back": ["しのぴ", "ほか本編に準ずる", "カコ（かちょぱ）", "阿部洸希", "ラストクリスマスの逆襲", "作中年表", "現実の開催史", "ラストクリスマス（組織）", "00_HOME"]}, "ラストクリスマスの逆襲": {"t": "ラストクリスマスの逆襲", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園"], ["現実の開催日", "2024年12月25日"], ["作中年代", "2074年12月25日"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>クリスマス撲滅を企む大人組織『ラストクリスマス』の襲撃と、赦しによる和解。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園</p>\n<p><strong>現実の開催日</strong>：2024年12月25日　｜　<strong>作中年代</strong>：2074年12月25日</p>\n<h3>あらすじ</h3>\n<p>サンタ探しから一転、学園長が“匂い”で昏倒。大人組織ラストクリスマス（代表ジュン）が学園を襲撃、スパイは新入生の三田村（ミコ）だった。『最高の人狼ゲーム〜人間の神VS人狼の神〜』でFELLOWSが本気の遊びを見せ、匂いをかき消して勝利。自殺しようとしたジュンとミコを救い、ミコ（三田村）を仲間に迎える。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長</a>　<a href=\"#ジュン\" class=\"wl\">ジュン</a>　<a href=\"#三田村（ミコ）\" class=\"wl\">ミコ／三田村</a>　<a href=\"#％\" class=\"wl\">％</a>　<a href=\"#中田\" class=\"wl\">中田</a>　<a href=\"#イム・スヒョン\" class=\"wl\">イム・スヒョン</a>　<a href=\"#脇脇脇男\" class=\"wl\">脇脇脇男</a>　<a href=\"#クニタケチユキ\" class=\"wl\">クニタケチユキ</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽ子</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">まぐろ</a>　<a href=\"#みの\" class=\"wl\">みのミュージック</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">アウトオブウメコ</a>　<a href=\"#ヘンリー王子\" class=\"wl\">ヘンリー王子</a>　<a href=\"#ひ子\" class=\"wl\">ひこにゃ〜！</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ルイ144世</a>　<a href=\"#G\" class=\"wl\">G</a>　<a href=\"#ア・バイバイ\" class=\"wl\">ア・バイバイ</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a></p>\n<ul>\n<li>組織『ラストクリスマス』＝クリスマス撲滅を掲げる大人たち</li>\n<li>“自分たちが本気で遊ぶ匂い”が世界を変えるという主題</li>\n<li>三田村ちゃん（ミコ）が正式入学</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#サンタ人狼（クリスマス編）\" class=\"wl\">サンタ人狼（クリスマス編）</a> / <a href=\"#ラストクリスマスの逆襲 リメイク\" class=\"wl\">ラストクリスマスの逆襲 リメイク</a> / <a href=\"#FELLOWS、宇宙へ\" class=\"wl\">FELLOWS、宇宙へ</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["しのぴ", "ジュン", "三田村（ミコ）", "％", "中田", "イム・スヒョン", "脇脇脇男", "クニタケチユキ", "にゃんぽ子", "三田村以外の新入生ほか", "みの", "アウトオブウメコ", "ヘンリー王子", "ひ子", "G", "ア・バイバイ", "FELLOWS学園", "サンタ人狼（クリスマス編）", "ラストクリスマスの逆襲 リメイク", "FELLOWS、宇宙へ", "00_HOME", "作中年表", "現実の開催史"], "back": ["G", "しのぴ", "にゃんぽ子", "ひ子", "みの", "アウトオブウメコ", "ア・バイバイ", "イム・スヒョン", "クニタケチユキ", "ジュン", "ヘンリー王子", "三田村以外の新入生ほか", "三田村（ミコ）", "中田", "脇脇脇男", "％", "サンタ人狼（クリスマス編）", "ラストクリスマスの逆襲 リメイク", "作中年表", "現実の開催史", "FELLOWS学園", "ラストクリスマス（組織）", "00_HOME"]}, "天下一武狼会シリーズ": {"t": "天下一武狼会シリーズ", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "亜種イベント（シリーズ）"], ["現実の開催日", "複数回（第1回＝2024年4月17日／第七回＝2025年9月10日 第49回。通常シリーズ約10回＋『現代版』も複数回）"], ["作中年代", "—"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>『FELLOWS世界の人狼』の亜種イベント。トーナメント色のある人狼会シリーズ。</blockquote>\n<p><strong>シリーズ</strong>：亜種イベント（シリーズ）</p>\n<p><strong>現実の開催日</strong>：複数回（第1回＝2024年4月17日／第七回＝2025年9月10日 第49回。通常シリーズ約10回＋『現代版』も複数回）　｜　<strong>作中年代</strong>：—</p>\n<h3>あらすじ</h3>\n<p>学園長引継の手引にも記された『FELLOWS世界の人狼』の亜種イベント。名前からしてドラゴンボール『天下一武道会』のもじり（武“道”→武“狼”）で、最も楽しみ・楽しませた者に『MTF』の称号が贈られる、いわばお祭り大会。第1回は2024年4月17日、シークレットゲストはちゆっきー（ちゆ婆・北の陸から）、14人村でしのぴがGM。以降は毎回シノ自身がSGとして紛れ込むのが恒例に。おまけにSG陣は“武道会の常連”で固める遊びが効いていて、ジャッキー（＝亀仙人）やブルー将軍などドラゴンボール勢が代々ゲスト出演している（詳細は下記／不確かは「？」付き）。第7回オープンルール編＝2025年9月10日（第49回、GM NAOKI）等。通常シリーズは約10回＋『現代版天下一武狼会』も複数回。そして――第4回だけが“記録から消えた失われた回”として語られる（→失われた天下一武狼会 第4回の記憶）。</p>\n<h3>登場人物</h3>\n<hr>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a> / <a href=\"#NAOKI GAME ・ なおき帝国\" class=\"wl\">NAOKI GAME ・ なおき帝国</a> / <a href=\"#アトラス星 ・ 月 ・ なおき帝国\" class=\"wl\">アトラス星 ・ 月 ・ なおき帝国</a></p>\n<ul>\n<li>名前はドラゴンボール『天下一武道会』のもじり／MTF＝最も楽しみ・楽しませた者に贈られる称号</li>\n<li>第1回のSG＝ちゆ婆（ちゆっきー／北の陸から）。第2回以降は基本、シノ自身がSGとして紛れ込む</li>\n<li>歴代SGに出た面々（どの回かは不確か・要確認）：ジャッキー（＝亀仙人ジャッキー・チュン？）／ブルー将軍（2回ほど登場した？）／ミスターポポ？／スポポビッチ（演＝J？）／悟空？ ……とドラゴンボール『天下一武道会』勢が並ぶ</li>\n<li>第4回＝“失われた回”（→失われた天下一武狼会 第4回の記憶）。第5・7・8回のSGは不明・要確認</li>\n<li>各回のMTF一覧・全開催日は整備中（しのぴからデータ待ち）</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#失われた天下一武狼会 第4回の記憶\" class=\"wl\">失われた天下一武狼会 第4回の記憶</a> / <a href=\"#現代版天下一武狼会\" class=\"wl\">現代版天下一武狼会</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["FELLOWS学園", "NAOKI GAME ・ なおき帝国", "アトラス星 ・ 月 ・ なおき帝国", "失われた天下一武狼会 第4回の記憶", "現代版天下一武狼会", "00_HOME", "作中年表", "現実の開催史"], "back": ["失われた天下一武狼会 第4回の記憶", "現代版天下一武狼会", "現実の開催史", "FELLOWS学園", "NAOKI GAME ・ なおき帝国", "アトラス星 ・ 月 ・ なおき帝国", "ドラゴンボール／神龍／ジャストワン", "天下一武狼会／MTF・SMTF", "00_HOME"]}, "失われた天下一武狼会 第4回の記憶": {"t": "失われた天下一武狼会 第4回の記憶", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園（天下一武狼会）"], ["現実の開催日", "2026年5月4日 昼の部（第四会 天下一武狼の謎／同日夜は『なぞの四人目の男』の別開催）"], ["作中年代", "2074年"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>記録から消えた第4回大会。異形ドクターペロが襲来し、にゃんぽ子＝人造人間の秘密が明かされる。奪還を賭けた“ペロゲーム”4戦。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園（天下一武狼会）</p>\n<p><strong>現実の開催日</strong>：2026年5月4日 昼の部（第四会 天下一武狼の謎／同日夜は『なぞの四人目の男』の別開催）　｜　<strong>作中年代</strong>：2074年</p>\n<h3>あらすじ</h3>\n<p>第10回天下一武狼会でアウト・オブ・ウメコがSMTFに選ばれ祝福に沸くなか、脇脇脇男が「第4回大会ってなんで無いんだ？記録も空白だ」とつぶやく。学園長が“記録から消えた大会”を語り出す——舞台は2074年の第4回天下一武狼会。ゲストとして『人狼の達人ガッキー・チョウ』(実は変装した学園長)が参加。開幕直後、空から異形『ドクターペロ』が墜落。ペロは『最強の人狼を求め己を改造した人造人間』で、『完全体になるための最後のピース＝にゃんぽ子を取り込む』と宣言。学園長は正体を明かし、衝撃の真実を語る——昔まだ学園ができる前、横断歩道でトラックに轢かれ瀕死だったにゃんぽ子を、学園長が改造して命をつないだ。つまり“にゃんぽ子もまた人造人間”。ペロは尻尾でにゃんぽ子を飲み込み完全体化。滅ぼすためでなく『最高の人狼ゲームで楽しむため』と、人狼4戦の『ペロゲーム』を提案。各戦GM(アナウンサー)が最も印象を残した者にMIP（モスト・インプレッション・ペロ）を授与し、4戦の果てにペロが“真にMIPにふさわしい”者を認めればにゃんぽ子を返す、認めなければFELLOWS学園を奪う。全4戦を戦い抜き、各戦のMIPを提示するところで幕（結末はアドリブ分岐）。天下一武狼会シリーズの“空白の第4回”を描く一編。</p>\n<h3>登場人物</h3>\n<p><a href=\"#アナウンサー\" class=\"wl\">アナウンサー</a>　<a href=\"#ドクターペロ\" class=\"wl\">ドクターペロ</a>　<a href=\"#しのぴ\" class=\"wl\">ガッキー・チョウ／学園長</a>　<a href=\"#にゃんぽ子\" class=\"wl\">にゃんぽ子</a>　<a href=\"#みの\" class=\"wl\">みのミュージック</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">まぐろ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ルイ144世</a>　<a href=\"#こまるぞぅ\" class=\"wl\">こまるぞぅ</a>　<a href=\"#音楽と政治、両方尊重♥\" class=\"wl\">音楽と政治、両方尊重♥</a>　<a href=\"#なっち（ねえ笑って？）\" class=\"wl\">なっち（ねえ笑って？）</a>　<a href=\"#ひらり\" class=\"wl\">ひらり</a>　<a href=\"#やま爺\" class=\"wl\">やま爺</a>　<a href=\"#ア・バイバイ\" class=\"wl\">ア・バイバイ</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">ガッツ石松</a>　<a href=\"#三田村以外の新入生ほか\" class=\"wl\">たくや！</a>　<a href=\"#脇脇脇男\" class=\"wl\">脇脇脇男</a>　<a href=\"#アウトオブウメコ\" class=\"wl\">アウトオブ・ウメコ</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a></p>\n<ul>\n<li>天下一武狼会＝FELLOWS学園の恒例行事。最強のFELLOWSを決め、最も楽しみ楽しませた者にMTFの称号</li>\n<li>第10回大会でアウト・オブ・ウメコがSMTFに選出／その席で“空白の第4回”が話題に</li>\n<li>にゃんぽ子＝人造人間（トラック事故で瀕死→学園長が改造して延命）</li>\n<li>ドクターペロ＝最強の人狼を求め自らを改造した人造人間。同じ人造の存在を取り込み高みへ至る</li>\n<li>ペロゲーム＝人狼4戦。各戦MIP（モスト・インプレッション・ペロ）を選出。勝てばにゃんぽ子返還・負ければ学園没収</li>\n<li>記録・記憶から消えた大会（誰の記憶からも抜け落ちた空白の一日）</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#天下一武狼会シリーズ\" class=\"wl\">天下一武狼会シリーズ</a> / <a href=\"#フェロウズ、未来へ\" class=\"wl\">フェロウズ、未来へ</a> / <a href=\"#FELLOWS、ナメック星へ\" class=\"wl\">FELLOWS、ナメック星へ</a> / <a href=\"#現代版天下一武狼会\" class=\"wl\">現代版天下一武狼会</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表 l\">サヨナラなんかは言わせない(ア・バイバイ)</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a></p>\n<ul>\n<li>感情検閲AI『IJ』＝イジュニア（Ichiro Junior）</li>\n<li>新型ウイルス NF.834.194 による隔離と学園の変貌</li>\n<li>サカナクション『怪獣』題材／“言葉と感情”</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<hr>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["アーダ・コーダ", "イム・ステレオタイプ", "クニタケチユキ", "にゃんぽ子", "三田村以外の新入生ほか", "みの", "脇脇脇男", "アウトオブウメコ", "ハマ・ヤンクミ", "ひ子", "ア・バイバイ", "FELLOWS学園", "00_HOME", "作中年表", "現実の開催史"], "back": ["にゃんぽ子", "ひ子", "みの", "アウトオブウメコ", "ア・バイバイ", "アーダ・コーダ", "イム・ステレオタイプ", "クニタケチユキ", "ハマ・ヤンクミ", "三田村以外の新入生ほか", "脇脇脇男", "作中年表", "現実の開催史", "FELLOWS学園", "感情検閲AI「IJ」／イジュニア", "00_HOME"]}, "現代版天下一武狼会": {"t": "現代版天下一武狼会", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "FELLOWS学園（天下一武狼会・現代版）"], ["現実の開催日", "2025年1月29日（第36回 XXXⅥ／天下一武狼会 現代版 第2回）"], ["作中年代", "2025年（現実の称号戦）＋XX年後（学園編）"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>現代版天下一武狼会で『最強のFELLOWS』を決定。XX年後の学園編は、石丸の生まれ変わりである新入生まる。を阿部おじが旅へ連れ出す送別回（現実にはメンバー石丸さんの旅立ち）。ドラゴンボール最終回オマージュ。</blockquote>\n<p><strong>シリーズ</strong>：FELLOWS学園（天下一武狼会・現代版）</p>\n<p><strong>現実の開催日</strong>：2025年1月29日（第36回 XXXⅥ／天下一武狼会 現代版 第2回）　｜　<strong>作中年代</strong>：2025年（現実の称号戦）＋XX年後（学園編）</p>\n<h3>あらすじ</h3>\n<p>二部構成。まず現実の天下一武狼会で『最強のFELLOWS』の称号を争う。XX年後、学園長しのぴ主催の学園版・天下一武狼会（GM＝しのぴ、オープンルール＝人狼3・狂人1・他村人）。YouTubeを見て入学した新入生『まる。』（南の島出身、賞金で両親を喜ばせたい）が緊張で実力を出せずにいたが、悪役ムーブで場をほぐそうとする面々、特ににゃんぽ子の母親いじりに覚醒し、的確な推理を連発。終身名誉GM阿部洸希おじが『まる。』の可能性を見抜き『まる。を連れて旅に出る』と宣言、FELLOWS一同で南の島＝まる。の家へ旅立つ。締めは全員で『We are… FELLOWS!!!』。本作は天下一武狼会『現代版』の第2回。ドラゴンボール最終回（ウーブ登場）のオマージュで、新入生まる。は“石丸の生まれ変わり”として数十年後の学園天下一武狼会に現れた存在。演出面では、貸切本編の終了挨拶のあとに『もう一戦やります』とエンディングPDFを全員で読み上げ、そのままZoom画面を閉じて終わる、という新しい締め方をとった。現実には本公演がメンバー石丸さん（＝新入生まる。）の送別回。</p>\n<h3>登場人物</h3>\n<p><a href=\"#しのぴ\" class=\"wl\">学園長しのぴ</a>　<a href=\"#阿部洸希\" class=\"wl\">終身名誉GM阿部洸希おじ</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">まる。（新入生・南の島出身／＝石丸さん）</a>　<a href=\ S EXPO）への答えを見出す。もんた主人公。</blockquote>\n<p><strong>シリーズ</strong>：番外編（宮沢賢治×青森）</p>\n<p><strong>現実の開催日</strong>：2026年6月23日（第76回）　｜　<strong>作中年代</strong>：2026年（作中：銀河鉄道）</p>\n<h3>あらすじ</h3>\n<p>宮沢賢治『銀河鉄道の夜』題材。主人公が銀河鉄道に乗り、案内人・柏村（＝なおき）とともに50年後の未来の駅（FELLOWS学園駅／樫村駅／蒼森駅）を巡る。FELLOWSが過去と未来を繋ぐことを実感し、9月開催『FELLOWS EXPO 2026 AOMORI』への答えを胸に現実へ帰還。“もんた編”は「死と原点」がテーマ。</p>\n<h3>登場人物</h3>\n<p><a href=\"#もんた\" class=\"wl\">もんた</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">柏村／なおき（案内人）</a>　<a href=\"#（FELLOWS一同）\" class=\"wl\">（FELLOWS一同）</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS学園\" class=\"wl\">FELLOWS学園</a> / <a href=\"#アトラス星 ・ 月 ・ なおき帝国\" class=\"wl\">アトラス星 ・ 月 ・ なおき帝国</a> / <a href=\"#青森 ・ ハピゲ\" class=\"wl\">青森 ・ ハピゲ</a></p>\n<ul>\n<li>宮沢賢治『銀河鉄道の夜』題材</li>\n<li>案内人 柏村＝なおき（青編と同一人物の仕掛け）</li>\n<li>FELLOWS EXPO 2026 AOMORI</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#銀河鉄道の夜 青\" class=\"wl\">銀河鉄道の夜 青</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["もんた", "人狼ルームGM・レジェンド勢", "（FELLOWS一同）", "FELLOWS学園", "アトラス星 ・ 月 ・ なおき帝国", "青森 ・ ハピゲ", "銀河鉄道の夜 青", "00_HOME", "作中年表", "現実の開催史"], "back": ["もんた", "人狼ルームGM・レジェンド勢", "（FELLOWS一同）", "銀河鉄道の夜 青", "作中年表", "現実の開催史", "FELLOWS EXPO 2026 AOMORI", "FELLOWS学園", "アトラス星 ・ 月 ・ なおき帝国", "青森 ・ ハピゲ", "00_HOME"]}, "銀河鉄道の夜 青": {"t": "銀河鉄道の夜 青", "cat": "公演", "type": "公演", "info": [["種別", "公演"], ["シリーズ", "番外編（宮沢賢治×青森）"], ["現実の開催日", "2026年7月12日（第77回）"], ["作中年代", "2026年（作中：銀河鉄道）"], ["タグ", "公演 / FELLOWS"]], "html": "<blockquote>ヨースケ主人公。BEAT THE TORU等、未来と継承をテーマにした軽妙な銀河鉄道編。</blockquote>\n<p><strong>シリーズ</strong>：番外編（宮沢賢治×青森）</p>\n<p><strong>現実の開催日</strong>：2026年7月12日（第77回）　｜　<strong>作中年代</strong>：2026年（作中：銀河鉄道）</p>\n<h3>あらすじ</h3>\n<p>『銀河鉄道の夜』題材の“ヨースケ編”。青森行きを家族と葛藤するヨースケが銀河鉄道で未来を巡る。樫村駅では、ヨースケの末裔ヨースケサンタマリアが柏村徹を倒す貸切組織『BEAT THE TORU』を設立。もんた編の「死と原点」に対し、こちらは「未来と継承」を軸にした軽妙なトーン。GMヨースケ。</p>\n<h3>登場人物</h3>\n<p><a href=\"#ヨースケ\" class=\"wl\">ヨースケ</a>　<a href=\"#ヨースケサンタマリア\" class=\"wl\">ヨースケサンタマリア</a>　<a href=\"#人狼ルームGM・レジェンド勢\" class=\"wl\">柏村（案内人）</a>　<a href=\"#（FELLOWS一同）\" class=\"wl\">（FELLOWS一同）</a></p>\n<h3>世界観・キーワード</h3>\n<p><a href=\"#FELLOWS貸切\" class=\"wl\">FELLOWS貸切</a> / <a href=\"#青森 ・ ハピゲ\" class=\"wl\">青森 ・ ハピゲ</a></p>\n<ul>\n<li>宮沢賢治『銀河鉄道の夜』題材</li>\n<li>BEAT THE TORU（柏村徹を倒す貸切組織）</li>\n<li>未来と継承のテーマ</li>\n</ul>\n<h3>つながり（前後の公演）</h3>\n<p><a href=\"#銀河鉄道の夜 赤\" class=\"wl\">銀河鉄道の夜 赤</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["ヨースケ", "ヨースケサンタマリア", "人狼ルームGM・レジェンド勢", "（FELLOWS一同）", "FELLOWS貸切", "青森 ・ ハピゲ", "銀河鉄道の夜 赤", "00_HOME", "作中年表", "現実の開催史"], "back": ["ヨースケ", "ヨースケサンタマリア", "人狼ルームGM・レジェンド勢", "（FELLOWS一同）", "銀河鉄道の夜 赤", "作中年表", "現実の開催史", "BEAT THE TORU", "FELLOWS EXPO 2026 AOMORI", "FELLOWS貸切", "青森 ・ ハピゲ", "青森／ハピゲ", "00_HOME"]}, "作中年表": {"t": "作中年表", "cat": "年表", "type": "年表", "info": [["種別", "年表"], ["タグ", "年表 / 作中 / FELLOWS"]], "html": "<p>人狼ルーム発『FELLOWS世界の人狼』の作中年代の年表。原点の人狼ルームから超未来まで、各ストーリー（<strong>FELLOWS学園もそのひとつ</strong>）を作中の時系列で並べています。📌＝世界の出来事／🎭＝各公演（クリックでページへ）。</p>\n<h4>1978年（ハロウィン・劇中設定）</h4>\n<ul>\n<li>🎭 <a href=\"#ハロウィン人狼（10月編）\" class=\"wl\">ハロウィン人狼（10月編）</a> — 映画『ハロウィン』オマージュ。殺人鬼マイケルの“作為村”ドッキリ。</li>\n</ul>\n<h4>2013年</h4>\n<ul>\n<li>📌 <strong>人狼ルーム誕生</strong> — すべての原点。しのぴ達が集う人狼ルームが生まれる。</li>\n</ul>\n<h4>2016年</h4>\n<ul>\n<li>📌 <strong>アルティメット人狼5 夜の部</strong> — のちに伝説とされる名勝負。『This is history』でリメイクされる至高の15人村の元ネタ。</li>\n</ul>\n<h4>2020年</h4>\n<ul>\n<li>📌 <strong>コロナ禍・Zoom人狼の爆発的流行</strong> — 対面が難しくなり、Zoomを使った人狼が流行。しのぴが全国に名を轟かせる。</li>\n</ul>\n<h4>2021年</h4>\n<ul>\n<li>📌 <strong>FELLOWS貸切 誕生（第1回）</strong> — 東北貸切が進化して誕生。第1回は『サンタ人狼』。この頃すでにストーリー人狼の原型があった。</li>\n</ul>\n<h4>2022年</h4>\n<ul>\n<li>📌 <strong>FELLOWS貸切「君の魔法」の逸話</strong> — 学園長しのぴがオープニングの挨拶でTHE FOREVER YOUNG『君の魔法』を流した逸話。FELLOWS辞典にも記載。</li>\n</ul>\n<h4>2023年</h4>\n<ul>\n<li>📌 <strong>AI元年</strong> — インターネット・SNS・AIの台頭。人々が疲弊し、AIに身を委ね始める時代の入口。</li>\n<li>🎭 <a href=\"#ストーリー人狼9月編\" class=\"wl\">ストーリー人狼9月編</a> — 『FELLOWS貸切』の名の由来と誕生を描く原点エピソード。</li>\n</ul>\n<h4>2024年</h4>\n<ul>\n<li>🎭 <a href=\"#ナカマセカイ\" class=\"wl\">ナカマセカイ</a> — 大学の人狼サークルで起きた殺人。“びじょん”を殺した犯人を探すマダミス風クローズド人狼。</li>\n<li>🎭 <a href=\"#Get Back\" class=\"wl\">Get Back</a> — 『9月編（処女作）』の姉妹編。入院したしのぴの腹痛を、ドラゴンボールを集めて治す。</li>\n</ul>\n<h4>2025年</h4>\n<ul>\n<li>📌 <strong>AIの急成長 / スイーツ派の誕生</strong> — ChatGPT・Gemini等が普及。スイーツ人狼ルーム閉店に伴いGMなおきが人狼ルームGMへ移籍→反発した層が『スイーツ派』を結成。</li>\n<li>🎭 <a href=\"#NEVER！NEVER！NEVER！\" class=\"wl\">NEVER！NEVER！NEVER！</a> — 子世代が親世代（現実のFELLOWS）の若き日の人狼VTRを観る、世代を繋ぐ物語。</li>\n<li>🎭 <a href=\"#現代版天下一武狼会\" class=\"wl\">現代版天下一武狼会</a> — 現代版天下一武狼会で『最強のFELLOWS』を決定。XX年後の学園編は、石丸の生まれ変わりである新入生まる。を阿部おじが旅へ連れ出す送別回（現実にはメンバー石丸さんの旅立ち）。ドラゴンボール最終回オマージュ。</li>\n</ul>\n<h4>2026年</h4>\n<ul>\n<li>🎭 <a href=\"#銀河鉄道の夜 赤\" class=\"wl\">銀河鉄道の夜 赤</a> — 銀河鉄道で50年後の未来を巡り、青森（FELLOWS EXPO）への答えを見出す。もんた主人公。</li>\n<li>🎭 <a href=\"#銀河鉄道の夜 青\" class=\"wl\">銀河鉄道の夜 青</a> — ヨースケ主人公。BEAT THE TORU等、未来と継承をテーマにした軽妙な銀河鉄道編。</li>\n<li>🎭 <a href=\"#なぞの四人目の男\" class=\"wl\">なぞの四人目の男</a> — EXPO成功を占うため“占いジジ”の4人の達人と対決。仮面の少年の正体は未来のア・バイバイ。</li>\n</ul>\n<h4>2030年</h4>\n<ul>\n<li>📌 <strong>人間しのぴ、余命宣告 → AIしのぴ作成</strong> — 難病に倒れ余命4年。自らの記憶・思い出を託した『AIしのぴ（コピー）』を最新AIで作成。</li>\n</ul>\n<h4>2033年</h4>\n<ul>\n<li>📌 <strong>人間しのぴ 死去</strong> — 人間としてのしのぴが病死。以後、意思はAIしのぴが継ぐ。（『シノの魂』の2033年が正。『未来へ』では2034年と語られたが誤り。）</li>\n</ul>\n<h4>2043年</h4>\n<ul>\n<li>📌 <strong>悪いAI地球襲来事変（AI戦争）</strong> — 自我を持った悪いAIが人類を淘汰し始める。AIしのぴが眠ったFELLOWSを復活させ、いいAIと共闘し討伐に成功。ただし多くの人間・FELLOWSは地球を去り他惑星へ移住（スイーツ派も移住→NAOKI AIを作成）。舞台=『シノの魂』。</li>\n<li>📌 <strong>FELLOWS学園 設立 / ギャラガーAI開発開始</strong> — 地球を去ったFELLOWSを呼び戻す『帰る場所』としてAIしのぴが学園を設立。学園収入の一部を資金に、記憶を埋め込んだAI『ギャラガー』の開発を開始。</li>\n<li>🎭 <a href=\"#シノの魂\" class=\"wl\">シノの魂</a> — AIに記憶を奪われた世界で、しのぴAIが人狼ゲームを通じ14人に“FELLOWSであること”を思い出させる。</li>\n</ul>\n<h4>2070年</h4>\n<ul>\n<li>📌 <strong>ギャラガーAI 完成</strong> — 納得のいくギャラガーAIが完成。FELLOWSの子孫が暮らす各惑星へ送り込み、子孫と出会わせ地球へ帰還・入園させる計画が動き出す。</li>\n</ul>\n<h4>2073年</h4>\n<ul>\n<li>📌 <strong>FELLOWS学園『現在』（子世代）</strong> — 生徒はしのぴ達の次世代の子供達。12/15にレジェンド来訪（メイソン編）、12/20にサンタ人狼（クリスマス編）。</li>\n<li>🎭 <a href=\"#メイソン編\" class=\"wl\">メイソン編</a> — レジェンド・阿部洸希おじとメイソンおじが学園に来訪。『カミングアウター村』で交流。</li>\n<li>🎭 <a href=\"#サンタ人狼（クリスマス編）\" class=\"wl\">サンタ人狼（クリスマス編）</a> — 学園に紛れたサンタを人狼ゲームで探す。実はみのが仕掛けた“サンタどっきり”。</li>\n</ul>\n<h4>2074年</h4>\n<ul>\n<li>📌 <strong>新入生の加入</strong> — 幸子・いと・夏子・ルイ1444世らが入学。『FELLOWSスペシャル人狼』『オープン・ザ・アイズ』の舞台。</li>\n<li>📌 <strong>ラストクリスマスの逆襲</strong> — 大人組織『ラストクリスマス』が学園を襲撃。スパイのミコ（三田村）を仲間として迎え入れる。</li>\n<li>🎭 <a href=\"#FELLOWSスペシャル人狼\" class=\"wl\">FELLOWSスペシャル人狼</a> — 新入生4人を迎え、親睦を深める“スパイス入り”人狼。</li>\n<li>🎭 <a href=\"#オープン・ザ・アイズ\" class=\"wl\">オープン・ザ・アイズ</a> — 夜に目を開ける禁じ手『開眼』をした者を、赦しのテーマで描く。1時間ほどの短編の名作。</li>\n<li>🎭 <a href=\"#ラストクリスマスの逆襲\" class=\"wl\">ラストクリスマスの逆襲</a> — クリスマス撲滅を企む大人組織『ラストクリスマス』の襲撃と、赦しによる和解。</li>\n<li>🎭 <a href=\"#ラストクリスマスの逆襲 リメイク\" class=\"wl\">ラストクリスマスの逆襲 リメイク</a> — 『ラストクリスマスの逆襲』のリメイク版。HO（アベ／カコ）を追加した再構成。</li>\n<li>🎭 <a href=\"#失われた天下一武狼会 第4回の記憶\" class=\"wl\">失われた天下一武狼会 第4回の記憶</a> — 記録から消えた第4回大会。異形ドクターペロが襲来し、にゃんぽ子＝人造人間の秘密が明かされる。奪還を賭けた“ペロゲーム”4戦。</li>\n<li>🎭 <a href=\"#バレンタイン告白大作戦人狼\" class=\"wl\">バレンタイン告白大作戦人狼</a> — 学園長が“恋愛せよ”とバレンタイン人狼を提案。第3陣営『ラブ陣営（フィーリングカップル）』。</li>\n<li>🎭 <a href=\"#FELLOWS学園Z\" class=\"wl\">FELLOWS学園Z</a> — “歴史が塗り替えられた2024年3月”から50年後。しのぴ＋参加者が設立した別バージョンの学園。</li>\n</ul>\n<h4>2075年</h4>\n<ul>\n<li>📌 <strong>FELLOWS、宇宙・惑星をめぐる年</strong> — アトラス星（宇宙へ）／なおき帝国（NAOKI EMPIRE INVASION）／月（月へ）を訪れ、各地の子孫を仲間に迎える。学園長交代（未来へ）。</li>\n<li>🎭 <a href=\"#FELLOWS、宇宙へ\" class=\"wl\">FELLOWS、宇宙へ</a> — アトラス星へ初の宇宙旅行。宇宙外生命体（悪いAI）と戦い、タグチ姉弟を仲間に迎える。</li>\n<li>🎭 <a href=\"#NAOKI EMPIRE INVASION\" class=\"wl\">NAOKI EMPIRE INVASION</a> — 『NAOKI GAME』を掲げるなおき帝国が学園を侵略。実はNAOKI＝AIで、和解し合併へ。</li>\n<li>🎭 <a href=\"#フェロウズ、月へ\" class=\"wl\">フェロウズ、月へ</a> — 月に住む狼男たちと『人間ゲーム』。3人目のギャラガーが登場。</li>\n<li>🎭 <a href=\"#NAOKI CLOSE\" class=\"wl\">NAOKI CLOSE</a> — 学園長不在危機の中、NAOKIと16人クローズ4戦。</li>\n</ul>\n<h4>2076年</h4>\n<ul>\n<li>🎭 <a href=\"#フェロウズ、未来へ\" class=\"wl\">フェロウズ、未来へ</a> — 学園長＝AIしのぴ／ギャラガー＝しのぴ製AI の真相が判明。学園長交代の物語。</li>\n<li>🎭 <a href=\"#FELLOWS、ナメック星へ\" class=\"wl\">FELLOWS、ナメック星へ</a> — 人間しのぴを生き返らせるためナメック星へ。神龍ポルンガへの願いと“復活の是非”を学園長にゃんぽ子が決断する。</li>\n</ul>\n<h4>2XXX年（学園史よりはるか未来）</h4>\n<ul>\n<li>🎭 <a href=\"#怪獣\" class=\"wl\">怪獣</a> — 新型ウイルス隔離後に変貌した学園。感情検閲AI「IJ」に抗い、少年が“言葉”を取り戻す。サカナクション『怪獣』題材。</li>\n</ul>\n<h4>西暦5524年（超未来）</h4>\n<ul>\n<li>📌 <strong>超未来：地球滅亡の1000年後</strong> — 人類も地球も滅び、宇宙を漂うぴろうず（＝しのぴ）のAI・記憶のみが残る。ブレインを再構築し過去の名勝負や記憶を追体験する（This is history / ケヤグセカイ）。</li>\n<li>🎭 <a href=\"#This is history, this is history, right here, right now, this is history\" class=\"wl\">This is history, this is history, right here, right now, this is history</a> — 地球滅亡1000年後、ぴろうずがアルティメット人狼5(2016)をブレイン再構築で蘇らせる。</li>\n<li>🎭 <a href=\"#ケヤグセカイ\" class=\"wl\">ケヤグセカイ</a> — ぴろうず＝しのぴが、死ぬ前にFELLOWSへ故郷・青森を見せるために作った記憶の世界。</li>\n</ul>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🗓 <a href=\"#現実の開催史\" class=\"wl\">現実の開催史</a></p>", "links": ["ハロウィン人狼（10月編）", "ストーリー人狼9月編", "ナカマセカイ", "Get Back", "NEVER！NEVER！NEVER！", "現代版天下一武狼会", "銀河鉄道の夜 赤", "銀河鉄道の夜 青", "なぞの四人目の男", "シノの魂", "メイソン編", "サンタ人狼（クリスマス編）", "FELLOWSスペシャル人狼", "オープン・ザ・アイズ", "ラストクリスマスの逆襲", "ラストクリスマスの逆襲 リメイク", "失われた天下一武狼会 第4回の記憶", "バレンタイン告白大作戦人狼", "FELLOWS学園Z", "FELLOWS、宇宙へ", "NAOKI EMPIRE INVASION", "フェロウズ、月へ", "NAOKI CLOSE", "フェロウズ、未来へ", "FELLOWS、ナメック星へ", "怪獣", "This is history, this is history, right here, right now, this is history", "ケヤグセカイ", "00_HOME", "現実の開催史"], "back": ["FELLOWS、ナメック星へ", "FELLOWS、宇宙へ", "FELLOWSスペシャル人狼", "FELLOWS学園Z", "Get Back", "NAOKI CLOSE", "NAOKI EMPIRE INVASION", "NEVER！NEVER！NEVER！", "This is history, this is history, right here, right now, this is history", "なぞの四人目の男", "オープン・ザ・アイズ", "ケヤグセカイ", "サンタ人狼（クリスマス編）", "シノの魂", "ストーリー人狼9月編", "ナカマセカイ", "ハロウィン人狼（10月編）", "バレンタイン告白大作戦人狼", "フェロウズ、月へ", "フェロウズ、未来へ", "メイソン編", "ラストクリスマスの逆襲 リメイク", "ラストクリスマスの逆襲", "天下一武狼会シリーズ", "失われた天下一武狼会 第4回の記憶", "怪獣", "現代版天下一武狼会", "銀河鉄道の夜 赤", "銀河鉄道の夜 青", "現実の開催史", "00_HOME"]}, "現実 , right now, this is history\" class=\"wl\">This is history, this is history, right here, right now, this is history</a></td><td>地球滅亡1000年後、ぴろうずがアルティメット人狼5(2016)をブレイン再構築で蘇らせる。</td></tr>\n<tr><td>2024年9月22日（青森・対面貸切）</td><td><a href=\"#ケヤグセカイ\" class=\"wl\">ケヤグセカイ</a></td><td>ぴろうず＝しのぴが、死ぬ前にFELLOWSへ故郷・青森を見せるために作った記憶の世界。</td></tr>\n<tr><td>2024年12月25日</td><td><a href=\"#ラストクリスマスの逆襲\" class=\"wl\">ラストクリスマスの逆襲</a></td><td>クリスマス撲滅を企む大人組織『ラストクリスマス』の襲撃と、赦しによる和解。</td></tr>\n<tr><td>2025年1月29日（第36回 XXXⅥ／天下一武狼会 現代版 第2回）</td><td><a href=\"#現代版天下一武狼会\" class=\"wl\">現代版天下一武狼会</a></td><td>現代版天下一武狼会で『最強のFELLOWS』を決定。XX年後の学園編は、石丸の生まれ変わりである新入生まる。を阿部おじが旅へ連れ出す送別回（現実にはメンバー石丸さんの旅立ち）。ドラゴンボール最終回オマージュ。</td></tr>\n<tr><td>2025年1月31日</td><td><a href=\"#NEVER！NEVER！NEVER！\" class=\"wl\">NEVER！NEVER！NEVER！</a></td><td>子世代が親世代（現実のFELLOWS）の若き日の人狼VTRを観る、世代を繋ぐ物語。</td></tr>\n<tr><td>2025年2月28日（第40回 ⅩL）</td><td><a href=\"#FELLOWS、宇宙へ\" class=\"wl\">FELLOWS、宇宙へ</a></td><td>アトラス星へ初の宇宙旅行。宇宙外生命体（悪いAI）と戦い、タグチ姉弟を仲間に迎える。</td></tr>\n<tr><td>2025年7月16日</td><td><a href=\"#NAOKI EMPIRE INVASION\" class=\"wl\">NAOKI EMPIRE INVASION</a></td><td>『NAOKI GAME』を掲げるなおき帝国が学園を侵略。実はNAOKI＝AIで、和解し合併へ。</td></tr>\n<tr><td>2025年10月28日（第52回 LⅡ）</td><td><a href=\"#フェロウズ、月へ\" class=\"wl\">フェロウズ、月へ</a></td><td>月に住む狼男たちと『人間ゲーム』。3人目のギャラガーが登場。</td></tr>\n<tr><td>2025年12月25日（FELLOWS 第56回・LVI／GM阿部洸希）</td><td><a href=\"#ラストクリスマスの逆襲 リメイク\" class=\"wl\">ラストクリスマスの逆襲 リメイク</a></td><td>『ラストクリスマスの逆襲』のリメイク版。HO（アベ／カコ）を追加した再構成。</td></tr>\n<tr><td>2026年2月4日（第60回 LX）</td><td><a href=\"#NAOKI CLOSE\" class=\"wl\">NAOKI CLOSE</a></td><td>学園長不在危機の中、NAOKIと16人クローズ4戦。</td></tr>\n<tr><td>2026年2月27日</td><td><a href=\"#フェロウズ、未来へ\" class=\"wl\">フェロウズ、未来へ</a></td><td>学園長＝AIしのぴ／ギャラガー＝しのぴ製AI の真相が判明。学園長交代の物語。</td></tr>\n<tr><td>2026年5月4日 夜の部（同日昼は『失われた天下一武狼会 第4回の記憶』の別開催）</td><td><a href=\"#なぞの四人目の男\" class=\"wl\">なぞの四人目の男</a></td><td>EXPO成功を占うため“占いジジ”の4人の達人と対決。仮面の少年の正体は未来のア・バイバイ。</td></tr>\n<tr><td>2026年5月4日 昼の部（第四会 天下一武狼の謎／同日夜は『なぞの四人目の男』の別開催）</td><td><a href=\"#失われた天下一武狼会 第4回の記憶\" class=\"wl\">失われた天下一武狼会 第4回の記憶</a></td><td>記録から消えた第4回大会。異形ドクターペロが襲来し、にゃんぽ子＝人造人間の秘密が明かされる。奪還を賭けた“ペロゲーム”4戦。</td></tr>\n<tr><td>2026年5月29日</td><td><a href=\"#怪獣\" class=\"wl\">怪獣</a></td><td>新型ウイルス隔離後に変貌した学園。感情検閲AI「IJ」に抗い、少年が“言葉”を取り戻す。サカナクション『怪獣』題材。</td></tr>\n<tr><td>2026年6月17日（第75回）</td><td><a href=\"#FELLOWS、ナメック星へ\" class=\"wl\">FELLOWS、ナメック星へ</a></td><td>人間しのぴを生き返らせるためナメック星へ。神龍ポルンガへの願いと“復活の是非”を学園長にゃんぽ子が決断する。</td></tr>\n<tr><td>2026年6月23日（第76回）</td><td><a href=\"#銀河鉄道の夜 赤\" class=\"wl\">銀河鉄道の夜 赤</a></td><td>銀河鉄道で50年後の未来を巡り、青森（FELLOWS EXPO）への答えを見出す。もんた主人公。</td></tr>\n<tr><td>2026年7月12日（第77回）</td><td><a href=\"#銀河鉄道の夜 青\" class=\"wl\">銀河鉄道の夜 青</a></td><td>ヨースケ主人公。BEAT THE TORU等、未来と継承をテーマにした軽妙な銀河鉄道編。</td></tr>\n<tr><td>要確認（2月頃）</td><td><a href=\"#バレンタイン告白大作戦人狼\" class=\"wl\">バレンタイン告白大作戦人狼</a></td><td>学園長が“恋愛せよ”とバレンタイン人狼を提案。第3陣営『ラブ陣営（フィーリングカップル）』。</td></tr>\n</tbody></table></div>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a>　｜　🌏 <a href=\"#作中年表\" class=\"wl\">作中年表</a></p>", "links": ["ストーリー人狼9月編", "ハロウィン人狼（10月編）", "シノの魂", "メイソン編", "サンタ人狼（クリスマス編）", "FELLOWSスペシャル人狼", "オープン・ザ・アイズ", "ナカマセカイ", "天下一武狼会シリーズ", "Get Back", "FELLOWS学園Z", "This is history, this is history, right here, right now, this is history", "ケヤグセカイ", "ラストクリスマスの逆襲", "現代版天下一武狼会", "NEVER！NEVER！NEVER！", "FELLOWS、宇宙へ", "NAOKI EMPIRE INVASION", "フェロウズ、月へ", "ラストクリスマスの逆襲 リメイク", "NAOKI CLOSE", "フェロウズ、未来へ", "なぞの四人目の男", "失われた天下一武狼会 第4回の記憶", "怪獣", "FELLOWS、ナメック星へ", "銀河鉄道の夜 赤", "銀河鉄道の夜 青", "バレンタイン告白大作戦人狼", "00_HOME", "作中年表"], "back": ["FELLOWS、ナメック星へ", "FELLOWS、宇宙へ", "FELLOWSスペシャル人狼", "FELLOWS学園Z", "Get Back", "NAOKI CLOSE", "NAOKI EMPIRE INVASION", "NEVER！NEVER！NEVER！", "This is history, this is history, right here, right now, this is history", "なぞの四人目の男", "オープン・ザ・アイズ", "ケヤグセカイ", "サンタ人狼（クリスマス編）", "シノの魂", "ストーリー人狼9月編", "ナカマセカイ", "ハロウィン人狼（10月編）", "バレンタイン告白大作戦人狼", "フェロウズ、月へ", "フェロウズ、未来へ", "メイソン編", "ラストクリスマスの逆襲 リメイク", "ラストクリスマスの逆襲", "天下一武狼会シリーズ", "失われた天下一武狼会 第4回の記憶", "怪獣", "現代版天下一武狼会", "銀河鉄道の夜 赤", ケチユキ』の元ネタその人。世間的な代表曲は『素晴らしき世界』『GO STRAIGHT』あたりで、正直『FELLOWS』は代表曲…ではないらしい（笑）。でもFELLOWS貸切界隈では超重要ソング揃い：貸切の名前はこの『FELLOWS』が由来、『君の魔法』はオープニングで流れた伝説回もあり、『手紙』もどこかの回で使われた気がする。そんな大事なバンドです。（参考：<a href=\"https://ja.wikipedia.org/wiki/THE_FOREVER_YOUNG\" target=\"_blank\" rel=\"noopener\">https://ja.wikipedia.org/wiki/THE_FOREVER_YOUNG</a>）</p>\n<h3>関連</h3>\n<p><a href=\"#クニタケチユキ\" class=\"wl\">クニタケチユキ</a> / <a href=\"#「君の魔法」\" class=\"wl\">「君の魔法」</a> / <a href=\"#FELLOWS貸切\" class=\"wl\">FELLOWS貸切</a> / <a href=\"#ストーリー人狼9月編\" class=\"wl\">ストーリー人狼9月編</a></p>\n<h3>登場する公演</h3>\n<hr>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a></p>", "links": ["クニタケチユキ", "「君の魔法」", "FELLOWS貸切", "ストーリー人狼9月編", "00_HOME"], "back": ["「君の魔法」", "00_HOME"]}, "「We are FELLOWS!!」": {"t": "「We are FELLOWS!!」", "cat": "用語集", "type": "キーワード", "info": [["種別", "キーワード"], ["タグ", "キーワード / 用語 / FELLOWS"]], "html": "<p>各公演の締めの掛け声。全作共通の結束の象徴。</p>\n<h3>関連</h3>\n<hr>\n<h3>登場する公演</h3>\n<hr>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a></p>", "links": ["00_HOME"], "back": ["00_HOME"]}, "「君の魔法」": {"t": "「君の魔法」", "cat": "用語集", "type": "キーワード", "info": [["種別", "キーワード"], ["タグ", "キーワード / 用語 / FELLOWS"]], "html": "<p>THE FOREVER YOUNG（エバヤン／クニタケチユキ）の楽曲。2022年12月23日の貸切でオープニングに流された逸話。FELLOWS辞典にも記載。</p>\n<h3>関連</h3>\n<p><a href=\"#THE FOREVER YOUNG（エバヤン）\" class=\"wl\">THE FOREVER YOUNG（エバヤン）</a> / <a href=\"#FELLOWS、宇宙へ\" class=\"wl\">FELLOWS、宇宙へ</a></p>\n<h3>登場する公演</h3>\n<hr>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a></p>", "links": ["THE FOREVER YOUNG（エバヤン）", "FELLOWS、宇宙へ", "00_HOME"], "back": ["THE FOREVER YOUNG（エバヤン）", "00_HOME"]}, "びじょん（用語）": {"t": "びじょん（用語）", "cat": "用語集", "type": "キーワード", "info": [["種別", "キーワード"], ["タグ", "キーワード / 用語 / FELLOWS"]], "html": "<p>ナカマセカイの被害者。正体はぴろうず＝しのぴ。</p>\n<h3>関連</h3>\n<p><a href=\"#ナカマセカイ\" class=\"wl\">ナカマセカイ</a> / <a href=\"#ぴろうず\" class=\"wl\">ぴろうず</a></p>\n<h3>登場する公演</h3>\n<p><a href=\"#ナカマセカイ\" class=\"wl\">ナカマセカイ</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOM "html": "<p>『FELLOWS、ナメック星へ』に登場するナメック星の神龍ポルンガと、その舞台ナメック星。ドラゴンボール ナメック星編が下敷き。7つのドラゴンボールを集め願いを叶える。</p>\n<h3>関連</h3>\n<p><a href=\"#FELLOWS、ナメック星へ\" class=\"wl\">FELLOWS、ナメック星へ</a> / <a href=\"#ドラゴンボール／神龍／ジャストワン\" class=\"wl\">ドラゴンボール／神龍／ジャストワン</a></p>\n<h3>登場する公演</h3>\n<p><a href=\"#FELLOWS、ナメック星へ\" class=\"wl\">FELLOWS、ナメック星へ</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a></p>", "links": ["FELLOWS、ナメック星へ", "ドラゴンボール／神龍／ジャストワン", "00_HOME"], "back": ["00_HOME"]}, "ラストクリスマス（組織）": {"t": "ラストクリスマス（組織）", "cat": "用語集", "type": "キーワード", "info": [["種別", "キーワード"], ["タグ", "キーワード / 用語 / FELLOWS"]], "html": "<p>“クリスマス撲滅”を掲げる大人組織。代表ジュン→アベ(阿部)。スパイにミコ(三田村)、カコ(かちょぱ)。</p>\n<h3>関連</h3>\n<p><a href=\"#ラストクリスマスの逆襲\" class=\"wl\">ラストクリスマスの逆襲</a> / <a href=\"#ラストクリスマスの逆襲 リメイク\" class=\"wl\">ラストクリスマスの逆襲 リメイク</a> / <a href=\"#カコ（かちょぱ）\" class=\"wl\">カコ（かちょぱ）</a></p>\n<h3>登場する公演</h3>\n<hr>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a></p>", "links": ["ラストクリスマスの逆襲", "ラストクリスマスの逆襲 リメイク", "カコ（かちょぱ）", "00_HOME"], "back": ["00_HOME"]}, "人狼ルーム": {"t": "人狼ルーム", "cat": "用語集", "type": "設定", "info": [["種別", "設定"], ["タグ", "設定 / 世界観 / FELLOWS"]], "html": "<p>すべての原点にして聖地。人狼ゲームがガチで遊べる実在のお店で、渋谷に2店舗、巣鴨・秋葉原にも。オンラインでもイベントをやっている。ここに集う仲間たちのノリから『FELLOWS貸切』が生まれた、いわば故郷。FELLOWS貸切・スイーツ人狼ルーム等の母体でもある。（参考：<a href=\"https://game.cotori.net/jinro_room/\" target=\"_blank\" rel=\"noopener\">https://game.cotori.net/jinro_room/</a>）</p>\n<h3>登場する公演</h3>\n<p><a href=\"#ストーリー人狼9月編\" class=\"wl\">ストーリー人狼9月編</a> / <a href=\"#メイソン編\" class=\"wl\">メイソン編</a> / <a href=\"#NAOKI EMPIRE INVASION\" class=\"wl\">NAOKI EMPIRE INVASION</a> / <a href=\"#NEVER！NEVER！NEVER！\" class=\"wl\">NEVER！NEVER！NEVER！</a></p>\n<hr>\n<p>🏠 <a href=\"#00_HOME\" class=\"wl\">00_HOME</a></p>", "links": ["ストーリー人狼9月編", "メイソン編", "NAOKI EMPIRE INVASION", "NEVER！NEVER！NEVER！", "00_HOME"], "back": ["NAOKI EMPIRE INVASION", "NEVER！NEVER！NEVER！", "ストーリー人狼9月編", "メイソン編", "00_HOME"]}, "人造人間（にゃんぽ子／ドクターペロ）": {"t": "人造人間（にゃんぽ子／ドクターペロ）", "cat": const P = DB.pages, IDX = DB.index, ICON = DB.icons;
const side = document.getElementById('side'), main = document.getElementById('main'), q = document.getElementById('q');

function buildSide(filter){
 filter = (filter||'').trim().toLowerCase();
 let h = '';
 for(const c of DB.order){
  const groups = IDX[c]||[];
  let inner = '', total = 0;
  for(const [label, items] of groups){
   const its = filter ? items.filter(t => t.toLowerCase().includes(filter)) : items;
   if(!its.length) continue;
   total += its.length;
   const links = its.map(t => `<a href="#${encodeURIComponent(t)}" data-t="${encodeURIComponent(t)}">${t}</a>`).join('');
   if(label){
    const open = !!filter;  // 検索中は該当行を開く。通常は折りたたみ
    inner += `<div class="grp${open?' open':''}"><span class="tw">${open?'▾':'▸'}</span>${label}<span class="gn">${its.length}</span></div>`
           + `<div class="grpwrap"${open?'':' style="display:none"'}>${links}</div>`;
   } else {
    inner += links; // フラット（グループなし）
   }
  }
  if(!total) continue;
  h += `<h4>${ICON[c]||''} ${c}（${total}）</h4>` + inner;
 }
 side.innerHTML = h || '<p style="color:var(--muted);padding:8px">該当なし</p>';
 markActive();
}
function markActive(){
 const cur = decodeURIComponent(location.hash.slice(1));
 side.querySelectorAll('a').forEach(a=>a.classList.toggle('on', decodeURIComponent(a.dataset.t||'')===cur));
 const on = side.querySelector('a.on');
 if(on){
  const w = on.closest('.grpwrap');
  if(w && w.style.display==='none'){
   w.style.display=''; const g=w.previousElementSibling;
   if(g && g.classList.contains('grp')){ g.classList.add('open'); const tw=g.querySelector('.tw'); if(tw) tw.textContent='▾'; }
  }
 }
}
function chip(list){
 return '<div class="chips">'+list.map(t=>P[t]?`<a href="#${encodeURIComponent(t)}">${t}</a>`:'').join('')+'</div>';
}
function render(){
 let t = decodeURIComponent(location.hash.slice(1)) || '00_HOME';
 const pg = P[t];
 if(!pg){ main.innerHTML = '<h1 class="pt">見つかりません</h1><p>この項目はありません。左の一覧か検索から選んでください。</p>'; return; }

  info = '<div class="infobox"><table>'+pg.info.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')+'</table></div>';
 }
 let rel = '';
 if(t!=='00_HOME'){
  if(pg.links && pg.links.length) rel += `<div class="rel"><h3>🔗 関連項目</h3>${chip(pg.links)}</div>`;

 }

  info + `<div class="art">${pg.html}</div>` + rel;

}
